<!DOCTYPE html>
<html lang="en">
<head>
    <title>config</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--<link rel="stylesheet" href="http://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/css/bootstrap.min.css">-->
    <style>
        body {
            font-family: "Helvetica Neue",Helvetica,Arial,sans-serif;
            font-size: 14px;
            line-height: 1.42857143;
            color: #333;
            background-color: #fff;
        }

        h2 {
            display: inline;
            margin: 15px 0 0 60px;
        }

        .navbar {
            position: relative;
            min-height: 50px;
            margin-bottom: 20px;
            border: 1px solid transparent;
        }

        .navbar-default {
            background-color: #f8f8f8;
            border-color: #e7e7e7;
        }

        .container-fluid {
            padding-right: 15px;
            padding-left: 15px;
            margin-right: auto;
            margin-left: auto;
        }

            .container-fluid > .navbar-collapse, .container-fluid > .navbar-header, .container > .navbar-collapse, .container > .navbar-header {
                margin-right: -15px;
                margin-left: -15px;
            }

        .container {
            padding-right: 15px;
            padding-left: 15px;
            margin-right: auto;
            margin-left: auto;
        }

        .table {
            width: 100%;
            min-width: 290px;
            margin-bottom: 20px;
            background-color: transparent;
            border-spacing: 0;
            border-collapse: collapse;
        }

        .table-striped > tbody > tr:nth-child(odd) > td,
        .table-striped > tbody > tr:nth-child(odd) > th {
            background-color: #f9f9f9;
        }

        .table > tbody > tr > td, .table > tbody > tr > th, .table > tfoot > tr > td, .table > tfoot > tr > th, .table > thead > tr > td, .table > thead > tr > th {
            padding: 8px;
            text-align: left;
        }

        .btn {
            padding: 6px 12px;
            cursor: pointer;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            border: 1px solid transparent;
        }

        .pull-right {
            float: right !important;
        }
        /***/
        .myContainer {
            position: absolute;
            left: 40%;
        }

        @media (max-width: 950px) {
            .myContainer {
                left: 35%;
            }
        }

        @media (max-width: 750px) {
            .myContainer {
                left: 30%;
            }
        }

        @media (max-width: 620px) {
            .myContainer {
                left: 20%;
            }

            .navbar {
                min-height: 70px;
            }

            h2 {
                margin: 40px 5px 8px 60px;
            }
        }

        @media (max-width: 450px) {
            .myContainer {
                left: 5%;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-default">
        <div class="container-fluid">
            <div class="navbar-header">
                <img src="content/img/logo.png" height="40">
                <h2 class="myContainer">configuration</h2>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="myContainer">
            <table class="table table-hover table-striped">
                <thead>
                    <tr>
                        <th colspan="2">Hight Priority</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>
                            Network :

                        </td>
                        <td>
                            <select name="Network">
                                <option value="Shmulik-wifi">Shmulik-wifi</option>
                                <option value="Maba">Maba</option>
                                <option value="Maba-2">Maba-2</option>
                                <option value="Oren">Oren</option>
                                <option value="Hotbox-88">Hotbox-88</option>
                            </select>
                        </td>

                    </tr>
                    <tr>
                        <td>
                            Password :
                        </td>
                        <td>
                            <input type="password" placeholder="Network Password" />
                        </td>
                    </tr>
                </tbody>
            </table>
            <table class="table table-hover table-striped">
                <thead>
                    <tr>
                        <th colspan="2">Middle Priority</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            Network :
                        </td>
                        <td>
                            <select name="Network">
                                <option value="Shmulik-wifi">Shmulik-wifi</option>
                                <option value="Maba">Maba</option>
                                <option value="Maba-2">Maba-2</option>
                                <option value="Oren">Oren</option>
                                <option value="Hotbox-88">Hotbox-88</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Password :
                        </td>
                        <td>
                            <input type="password" placeholder="Network Password" />
                        </td>
                    </tr>
                </tbody>
            </table>
            <table class="table table-hover table-striped">
                <thead>
                    <tr>
                        <th colspan="2">Low Priority</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>
                            Network :

                        </td>
                        <td>
                            <select name="Network">
                                <option value="Shmulik-wifi">Shmulik-wifi</option>
                                <option value="Maba">Maba</option>
                                <option value="Maba-2">Maba-2</option>
                                <option value="Oren">Oren</option>
                                <option value="Hotbox-88">Hotbox-88</option>
                            </select>
                        </td>

                    </tr>
                    <tr>
                        <td>
                            Password :
                        </td>
                        <td>

                            <input type="password" placeholder="Network Password" />
                        </td>

                    </tr>
                </tbody>
            </table>
            <button class="btn pull-right">Save</button>
        </div>
    </div>

</body>
</html>
