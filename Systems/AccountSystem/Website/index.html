<body class="login example2">

    <div id="fixLoading" class="fixLoading"><div class="fixLoading-inner"></div></div>
    <div class="LoginLogoContainer">
        <img src="/Content/img/logo_g.png" class="imgLogo" />
        <div class="dropdown pull-right">
            <a data-toggle="dropdown" data-hover="dropdown" class="dropdown-toggle" data-close-others="true">
                <img id="LanId" class="flagImg">
                <span id="LanName" class="username"></span>
                <i class="clip-chevron-down"></i>
            </a>
            <ul class="dropdown-menu">
                <li>
                    <a onclick="setLanguage('en')">
                        <img id="enImage" class="flagImg"><span translate="ADMIN_ACCOUNT_LANGUAGE_EN" class="title colMarginLeft"></span><i class="icon-arrow"></i>
                    </a>
                </li>
                <!--<li>
                    <a onclick="setLanguage('es')">
                        <img id="esImage" class="flagImg"><span translate="ADMIN_ACCOUNT_LANGUAGE_ES" class="title colMarginLeft "></span><i class="icon-arrow"></i>
                    </a>
                </li>
                <li>
                    <a onclick="setLanguage('fr')">
                        <img id="frImage" class="flagImg"><span translate="ADMIN_ACCOUNT_LANGUAGE_FR" class="title colMarginLeft "></span><i class="icon-arrow"></i>
                    </a>
                </li>-->

            </ul>
        </div>
    </div>
    <div class="main-login col-md-4 col-md-offset-4 col-sm-6 col-sm-offset-3">
        <div id="main-container">

            <!-- start: LOGIN BOX -->
            <div class="box-login">


                <h3 translate="ACCOUNT_LOGIN_SYSTEM_LOGIN_TITLE"></h3>
                <p translate="ACCOUNT_LOGIN_SYSTEM_LOGIN_SUB_TITLE"></p>
                <form class="form-login">
                    <div class="errorHandler alert alert-danger no-display">
                        <i class="fa fa-remove-sign"></i><span translate="G_F_V_ERR_MSG"></span>
                    </div>
                    <fieldset>
                        <div class="form-group">
                            <span class="input-icon">
                                <input type="text" class="form-control" name="emailLogin" id="emailLogin" placeholder="G_EMAIL">
                                <i class="fa fa-user"></i>
                            </span>

                        </div>
                        <div class="form-group form-actions">
                            <span class="input-icon">
                                <input type="password" class="form-control password" name="passwordLogin" id="passwordLogin" placeholder="ACCOUNT_LOGIN_SYSTEM_LOGIN_PASS">
                                <i class="fa fa-lock"></i>
                                <a translate="ACCOUNT_LOGIN_SYSTEM_LOGIN_FORGOT" class="forgot" href="?box=forgot">

                                </a>
                            </span>
                        </div>
                        <div class="form-actions">

                            <button translate="ACCOUNT_LOGIN_SYSTEM_G_SUBMIT" type="submit" id="submitLogin" class="btn btn-bricky pull-right ladda-button" data-style="expand-right"><span class="ladda-label"></span></button>
                        </div>
                        <h4><span translate="ACCOUNT_LOGIN_SYSTEM_LOGIN_OR"></span></h4>


                        <div id="errLogin"></div>


                        <div class="new-account">
                            <span translate="ACCOUNT_LOGIN_SYSTEM_LOGIN_NO_ACCOUNT"></span>
                            <a translate="ACCOUNT_LOGIN_SYSTEM_LOGIN_CERATE_ACCOUNT" href="?box=register" class="register">

                            </a>
                        </div>
                    </fieldset>
                </form>
                <div>
                    <button translate="ACCOUNT_LOGIN_SYSTEM_LOGIN_GOOGLE" class="btn btn-google-plus ladda-button" id="google" data-style="expand-right"></button>
                    <button translate="ACCOUNT_LOGIN_SYSTEM_LOGIN_FACEBOOK" class="btn-facebook ladda-button" id="facebook" data-style="expand-right"></button>
                </div>
            </div>
            <!-- end: LOGIN BOX -->
            <!--reset box-->
            <div class="box-reset">

                <h3 translate="ACCOUNT_LOGIN_SYSTEM_RESET_TITLE"></h3>
                <p translate="ACCOUNT_LOGIN_SYSTEM_RESET_SUB_TITLE">

                </p>
                <form class="form-reset">
                    <div class="errorHandler alert alert-danger no-display">
                        <i class="fa fa-remove-sign"></i><span translate="G_F_V_ERR_MSG"></span>
                    </div>
                    <fieldset>
                        <div class="form-group">
                            <span class="input-icon">
                                <input type="password" class="form-control" name="NewPassword" id="NewPassword" placeholder="ACCOUNT_LOGIN_SYSTEM_RESET_NEW_PASS">
                                <i class="fa fa-lock"></i>
                            </span>
                        </div>
                        <div class="form-group">
                            <span class="input-icon">
                                <input type="password" class="form-control" name="Confirmation" id="Confirmation" placeholder="ACCOUNT_LOGIN_SYSTEM_RESET_CONFIRMATION">
                                <i class=" fa fa-lock"></i>
                            </span>

                        </div>
                        <div class="form-actions">
                            <button translate="ACCOUNT_LOGIN_SYSTEM_G_SUBMIT" type="submit" id="submitReset" class="btn btn-bricky pull-right ladda-button" data-style="expand-right"><span class="ladda-label"></span></button>
                        </div>
                        <div id="errReset"></div>
                        <div id="resetMsg" class="msgDiv">
                            <p translate="ACCOUNT_LOGIN_SYSTEM_G_HELLO"></p>
                            <p translate="ACCOUNT_LOGIN_SYSTEM_RESET_NEW_PASS_MSG"><br /><a translate="GENERAL_LOGIN" href="?box=login"></a></p>

                            <!--<div>
                                <span translate="ACCOUNT_LOGIN_SYSTEM_G_GALCON_USA"></span><br>

                                <span translate="ACCOUNT_LOGIN_SYSTEM_G_GALCON_USA_PHONE"></span>
                            </div>-->
                            <a translate="ACCOUNT_LOGIN_SYSTEM_G_GO_TO_LOGIN" href="/"></a>
                        </div>
                    </fieldset>
                </form>
            </div>
            <!-- start: FORGOT BOX -->
            <div class="box-forgot">


                <h3 translate="ACCOUNT_LOGIN_SYSTEM_FORGOT_FORGOT_PASS"></h3>
                <p translate="ACCOUNT_LOGIN_SYSTEM_FORGOT_EMAIL">

                </p>
                <form class="form-forgot">
                    <div class="errorHandler alert alert-danger no-display">
                        <i class="fa fa-remove-sign"></i> <span translate="G_F_V_ERR_MSG"></span>
                    </div>
                    <fieldset>
                        <div class="form-group">
                            <span class="input-icon">
                                <input type="email" class="form-control" name="emailForget" id="emailForget" placeholder="G_EMAIL">
                                <i class="fa fa-envelope"></i>
                            </span>
                        </div>
                        <div id="errForget"></div>
                        <div id="forgotPassMsg" class="msgDiv">
                            <p translate="ACCOUNT_LOGIN_SYSTEM_G_HELLO"></p>
                            <p translate="ACCOUNT_LOGIN_SYSTEM_FORGOT_EMAIL_SENT"></p>
                            <p translate="ACCOUNT_LOGIN_SYSTEM_FORGOT_RESSET_PASS"></p>

                            <!--<div>
                                <span translate="ACCOUNT_LOGIN_SYSTEM_G_GALCON_USA"></span><br>

                                <span translate="ACCOUNT_LOGIN_SYSTEM_G_GALCON_USA_PHONE"></span>
                            </div>-->
                        </div>
                        <div class="form-actions">
                            <a href="?box=login" class="btn btn-light-grey go-back">
                                <i class="fa fa-circle-arrow-left"></i> <span translate="ACCOUNT_LOGIN_SYSTEM_G_BACK"></span>
                            </a>
                            <button type="submit" id="submitForget" class="btn btn-bricky pull-right ladda-button" data-style="expand-right"><span translate="ACCOUNT_LOGIN_SYSTEM_G_SUBMIT" class="ladda-label"></span></button>
                        </div>
                    </fieldset>
                </form>
            </div>
            <!-- end: FORGOT BOX -->
            <!-- start: REGISTER BOX -->
            <div class="box-register">

                <!--<button id="form-submit" class="btn btn-primary ladda-button" data-style="expand-left"><span class="ladda-label">expand-left</span></button>-->


                <h3 translate="ACCOUNT_LOGIN_SYSTEM_G_SIGN_UP"></h3>
                <p translate="ACCOUNT_LOGIN_SYSTEM_REGISTER_ACCOUNT_DETAILS">

                </p>
                <form class="form-register">
                    <div class="errorHandler alert alert-danger no-display">
                        <i class="fa fa-remove-sign"></i> <span translate="G_F_V_ERR_MSG"></span>
                    </div>
                    <fieldset>
                        <div class="form-group">
                            <input type="text" class="form-control" name="firstName" id="firstName" placeholder="ADMIN_ACCOUNT_G_FIRST_NAME">
                        </div>
                        <div class="form-group">
                            <input type="text" class="form-control" name="lastName" id="lastName" placeholder="ADMIN_ACCOUNT_G_LAST_NAME">
                        </div>
                        <div class="form-group">
                            <input type="text" class="form-control" name="address" id="address" placeholder="ADMIN_ACCOUNT_G_USER_ADD">
                        </div>
                        <div class="form-group">
                            <input type="text" class="form-control" name="phone" id="phone" placeholder="ADMIN_ACCOUNT_G_USER_PHONE">
                        </div>

                        <p translate="ACCOUNT_LOGIN_SYSTEM_REGISTER_ACCOUNT_DETAILS">

                        </p>
                        <div class="form-group">

                            <input type="email" class="form-control" name="RegEmail" id="RegEmail" placeholder="G_EMAIL">
                            <i class="fa fa-envelope"></i>

                        </div>
                        <div class="form-group">

                            <input type="password" class="form-control" id="RegPassword" name="RegPassword" placeholder="ACCOUNT_LOGIN_SYSTEM_LOGIN_PASS">
                            <i class="fa fa-lock"></i>

                        </div>
                        <div class="form-group">

                            <input type="password" class="form-control" name="confirmPassword" id="confirmPassword" placeholder="ADMIN_ACCOUNT_USER_CONFIRM_PASS">
                            <i class="fa fa-lock"></i>

                        </div>
                        <div id="emailConfirmDiv" class="msgDiv">
                            <p translate="ACCOUNT_LOGIN_SYSTEM_G_HELLO"></p>

                            <p translate="ACCOUNT_LOGIN_SYSTEM_REGISTER_CLICK_ON_EMAIL_LINK"></p>

                            <p translate="ACCOUNT_LOGIN_SYSTEM_REGISTER_COMPLETE_REGISTRATION"></p>
                            <!--<div>
                                <span translate="ACCOUNT_LOGIN_SYSTEM_G_GALCON_USA"></span><br>

                                <span translate="ACCOUNT_LOGIN_SYSTEM_G_GALCON_USA_PHONE"></span>
                            </div>-->
                        </div>
                        <div id="RegisterErr" class="errorHandler alert alert-danger none">
                            <h5 translate="ACCOUNT_LOGIN_SYSTEM_REGISTER_ERR"></h5>
                            <ul>
                                <li class="none" id="Register_Message_4" translate="ACCOUNT_LOGIN_SYSTEM_REGISTER_ERR_4" style=""></li>
                                <li class="none" id="Register_Message_6" translate="ACCOUNT_LOGIN_SYSTEM_REGISTER_ERR_6"></li>
                            </ul>
                        </div>
                        <div class="form-actions">
                            <a href="?box=login" class="btn btn-light-grey go-back">
                                <i class="fa fa-circle-arrow-left"></i> <span translate="ACCOUNT_LOGIN_SYSTEM_G_BACK"></span>
                            </a>

                            <button translate="ACCOUNT_LOGIN_SYSTEM_G_SUBMIT" type="submit" id="submitRegister" class="btn btn-bricky pull-right ladda-button" data-style="expand-right"><span class="ladda-label"></span></button>



                        </div>
                    </fieldset>
                </form>
            </div>
            <!-- end: REGISTER BOX -->
            <!--thank you-->
            <div class="box-thankYou">
                <div id="thankYouSuccess" class="thankYouSuccess">

                    <!--<img src="Content/img/logo_CyberRainByGalcon.png" class="imgLogo" />-->

                    <div class="msgDiv" id="thankYouSuccessFrame">
                        <h3 translate="ACCOUNT_LOGIN_SYSTEM_THANK_YOU_CONGRATULATIONS"></h3>
                        <p translate="ACCOUNT_LOGIN_SYSTEM_THANK_YOU_REGISTRATION">

                        </p>
                        <a translate="ACCOUNT_LOGIN_SYSTEM_G_GO_TO_LOGIN" href="?box=login?">

                        </a>
                    </div>
                </div>
                <div id="thankYouError" class="thankYouError">
                    <!--<img src="Content/img/logo_CyberRainByGalcon.png" class="imgLogo" />-->
               
                    <h3 translate="ACCOUNT_LOGIN_SYSTEM_G_ERROR"></h3>
                    <p translate="ACCOUNT_LOGIN_SYSTEM_THANK_YOU_REGISRERING_FAILD">

                    </p>
                    <a translate="ACCOUNT_LOGIN_SYSTEM_G_GO_TO_REGISTER" href="?box=register">

                    </a>
                </div>
                <div id="thankYouLoading" class="thankYouLoading">
                    <!--<img src="Content/img/logo_CyberRainByGalcon.png" class="imgLogo" />-->
                    
                    <h3 data-translate="ACCOUNT_LOGIN_SYSTEM_THANK_YOU_VALIDATING"></h3>
                    <p data-translate="ACCOUNT_LOGIN_SYSTEM_G_WAIT">


                    </p>

                </div>
            </div>


            <!--box app-->
            <div class="box-app">
                <div>



                    <div class="appDiv">
                        <h3 translate="ACCOUNT_LOGIN_SYSTEM_APP_LIST"></h3>
                        <p translate="ACCOUNT_LOGIN_SYSTEM_APP_CHOOSE_APP"></p>
                        <ul id="appUl" class="appUl"></ul>
                    </div>
                </div>
            </div>


        </div>

    </div>

    <script src="Files/vendor/bootstrap/bootstrap.js"></script>
