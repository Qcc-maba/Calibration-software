
<a class="dropdown-toggle" data-close-others="true" data-hover="dropdown" data-toggle="dropdown">
    
    
    <img height="15" width="15" class="circle-img" alt="" ng-src={{Img}}>
    <span class="username ng-binding">{{selectedLanguage}}</span>
    
</a>
<ul class="dropdown-menu translate" role="menu">
    <li>
        <div class="clearfix">
            <div class="thread-image smallMenuThreadImg">
                <img alt="" src="http://www.transcriptionstudio.com/wp-content/uploads/2011/06/USA-FLAG.jpg" class="circle-img Img">
            </div>
            <div class="thread-content smallMenuThreadLanguage" ng-click="changeLanguage('en' , 'http://www.transcriptionstudio.com/wp-content/uploads/2011/06/USA-FLAG.jpg')">
                <span>English</span>

            </div>
        </div>
    </li>
    <li>
        <div class="clearfix">
            <div class="thread-image smallMenuThreadImg">
                <img alt="" src="http://ak.picdn.net/shutterstock/videos/2433653/preview/stock-footage-seamless-spanish-flag-waving-in-the-wind-with-highly-detailed-fabric-texture.jpg" class="circle-img Img">
            </div>
            <div class="thread-content smallMenuThreadLanguage" ng-click="changeLanguage('es' , 'http://ak.picdn.net/shutterstock/videos/2433653/preview/stock-footage-seamless-spanish-flag-waving-in-the-wind-with-highly-detailed-fabric-texture.jpg')">
                <span>Español</span>

            </div>
        </div>
    </li>
    <li>
        <div class="clearfix">
            <div class="thread-image smallMenuThreadImg">
                <img alt="" src="https://cdn2.iconfinder.com/data/icons/flags/flags/48/France.png" class="circle-img Img">
            </div>
            <div class="thread-content smallMenuThreadLanguage" ng-click="changeLanguage('fr' , 'https://cdn2.iconfinder.com/data/icons/flags/flags/48/France.png')">
                <span>Français</span>

            </div>
        </div>
    </li>
   
</ul>
