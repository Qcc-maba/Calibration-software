<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title></title>
    <style>
        table {
            width: 100%;
        }

        .sectionPadding {
            padding: 5px 0px 10px 0;
        }

        .navbar {
            position: relative;
            min-height: 50px;
            border: 1px solid transparent;
        }

        a {

        }

            border-color: #e7e7e7;

        input[type=text], input[type=password] {

            margin: 0 auto;

        }

        .network {

        }

        }

        .securityContainer {

        }

        th {

        tr > td, tr > th {

            border: 1px solid lightgray;
        }

        .storedProfiles {
            background: rgba(169, 169, 169, 0.02);
        }

        .buttonAdd, .buttonApply {
            float: right;
            margin-left: 7px;
            margin-right: 7px;
        }

        .mac {
            color: grey;
            font-size: small;
        }

        .minHeightSection {

        }
    </style>

</head>

    <script>
        var serverPrefix = "http://cyber-rain.net/";
        const SELECT_NETWORK = "-- Select Network --";
        const MANUAL_NETWORK = "Manual network";
        //--------------------arrays from device-------------------------------------

        //var storedProfiles = [
        //		{ SSID: '__SL_G_PN1', SecurityType : '__SL_G_PS1' , Priority: '__SL_G_PP1' , ProfileNumber: 1},
        //		{ SSID: '__SL_G_PN2', SecurityType : '__SL_G_PS2' , Priority: '__SL_G_PP2' , ProfileNumber: 2},
        //		{ SSID: '__SL_G_PN3', SecurityType : '__SL_G_PS3' , Priority: '__SL_G_PP3' , ProfileNumber: 3},
        //		{ SSID: '__SL_G_PN4', SecurityType : '__SL_G_PS4' , Priority: '__SL_G_PP4' , ProfileNumber: 4},
        //		{ SSID: '__SL_G_PN5', SecurityType : '__SL_G_PS5' , Priority: '__SL_G_PP5' , ProfileNumber: 5},
        //		{ SSID: '__SL_G_PN6', SecurityType : '__SL_G_PS6' , Priority: '__SL_G_PP6' , ProfileNumber: 6},
        //		{ SSID: '__SL_G_PN7', SecurityType : '__SL_G_PS7' , Priority: '__SL_G_PP7' , ProfileNumber: 7}
        //];
        var storedProfiles = [
              { SSID: 'manual network ggg', SecurityType: 0, Priority: 4, ProfileNumber: 1 },
              { SSID: 'ronen_peretz', SecurityType: 1, Priority: 3, ProfileNumber: 2 },
              { SSID: 'arvivo', SecurityType: 0, Priority: 2, ProfileNumber: 3 },
              { SSID: 'BezeqNGN_009882_2', SecurityType: 0, Priority: 1, ProfileNumber: 4 },
              { SSID: 'BezeqNGN_009882_2', SecurityType: 2, Priority: 1, ProfileNumber: 5 },
              { SSID: 'BezeqNGN_009882_2', SecurityType: 1, Priority: 1, ProfileNumber: 6 },
              { SSID: 'BezeqNGN_009882_2', SecurityType: 0, Priority: 1, ProfileNumber: 7 },

        ];
        var networksValues = {
            W1: '__SL_G_W01',
            W2: '__SL_G_W02',
            W3: '__SL_G_W03',
            W4: '__SL_G_W04',
            W5: '__SL_G_W05',
            W6: '__SL_G_W06',
            W7: '__SL_G_W07',
            W8: '__SL_G_W08',
            W9: '__SL_G_W09',
            W10: '__SL_G_W10'
        }
        networksValues = {
            W1: 'SSID:Bezeq Free, Type:00, RSSI:B.',
            W2: 'SSID:y-g law, Type:03, RSSI:B.',
            W3: 'SSID:ronen_peretz, Type:03, RSSI:C.',
            W4: 'SSID:BezeqNGN_009882_2.4GHz_1, Type:00, RSSI:B.',
            W5: 'SSID:Galcon2, Type:03, RSSI:A',
            W6: 'SSID:Bezeq Free, Type:00, RSSI:C.',
            W7: 'SSID:arvivo, Type:03, RSSI:C.',
            W8: 'SSID:HP-nomodel.C6A0BF, Type:00, RSSI:A',
            W9: 'SSID:Bezeq Free, Type:00, RSSI:A',
            W10: 'SSID:Galcon, Type:03, RSSI:A'
        }
        var networks = [];
        var SecurityTypes = {
            Open: "0",
            WEP: "1",
            WPA1: "2",
            WPA2: "3"
        }
        function getSecurityTypeString(num) {
            for (var x in SecurityTypes) {
                if (Number(SecurityTypes[x]) == num) {
                    return x;
                }
            }
        }
        function parseNetworks() {
            for (var i = 1; i <= 10; i++) {
                var network = networksValues["W" + i];
                if (!network.startsWith("SSID"))
                    continue;

                var parts = network.split(',');
                var o = {};
                for (p in parts) {
                    var tuple = parts[p].split(':');
                    switch (tuple[0].trim()) {
                        case "SSID":
                            o.SSID = tuple[1];
                            break;
                        case "Type":
                            o.Type = Number(tuple[1]);
                            break;
                        case "RSSI":
                            o.RSSI = tuple[1];
                            break;
                    }
                }
                networks.push(o);
            }
        }
        function sendRequest(addr, params, success, error) {
            var r;
            if (window.XMLHttpRequest) {
                r = new XMLHttpRequest();
            } else {
                r = new ActiveXObject("Microsoft.XMLHTTP")
            }
            r.open("POST", serverPrefix + addr, true);
            r.setRequestHeader("Content-type", "application/x-www-form-urlencoded");

            r.onreadystatechange = success;
            r.onerror = error;

            r.send(params);
        }
        function removeSelectedProfile(profileIndex) {
            if (!profileIndex)
                return;
            sendRequest("remove_selected_profiles", "__SL_P_PRR=" + profileIndex);
            document.getElementsByClassName("buttonApply")[0].style.display = "block";
        }
        function getNetwork(SSID) {
            for (var net in networks) {
                if (networks[net].SSID == SSID) {
                    return networks[net];
                }
            }
            return null;
        }
        function closeAP() {
            sendRequest("No_content", "__SL_P_C01=0", function () {
                window.close();
            });
        }

        //this function called from UI (manual and auto)
        function addNewNetwork() {
            var select = document.getElementsByTagName('select')[0];
            var manualSettings = select.options[select.selectedIndex].value == MANUAL_NETWORK ? manualSettings = true : manualSettings = false;
            if (!manualSettings && (select.options[select.selectedIndex].value == SELECT_NETWORK))
                return;
            //save to device (POST)
            var ssid = null;
            var priority = 0;
            var networkType = -1;
            var password = document.getElementsByClassName("network")[0].querySelector(".networkPassword").value;
            if (manualSettings) {
                var form = document.getElementsByTagName("form")[0];
                for (var i = 0; i < form.length; i++) {
                    if (form[i].checked) {
                        networkType = form[i].value;
                    }
                }
                var temp = document.getElementsByClassName("network")[0].querySelector(".networkName").value;
                if (temp != "") {
                    ssid = temp;
                }
                else {
                    return;
                }
                //ssid=get network ssid from UI
                //networkType= get network type from UI
            }
            else {
                var network = getNetwork(select.options[select.selectedIndex].value);
                ssid = network.SSID;
                networkType = network.Type;
            }
            var params = "__SL_P_P.A=" + ssid 								//SSID
                               + "&__SL_P_P.B=" + networkType				//Type
                             + "&__SL_P_P.C=" + password					//Password
                               + "&__SL_P_P.D=" + priority;					//priority

            sendRequest("profiles_add.html", params, function () {
                //1. clear ui
                select.selectedIndex = 0;
                document.getElementsByClassName("securityContainer")[0].style.display = "none";
                document.getElementsByClassName("network")[0].querySelector(".networkName").readOnly = false;
                document.getElementsByClassName("network")[0].querySelector(".networkName").value = "";
                document.getElementsByClassName("network")[0].querySelector(".networkPassword").value = "";
                //2. show in table below
                addStoredProfileToTable(ssid, networkType, null);
                document.getElementsByClassName("buttonApply")[0].style.display = "block";
            });
        }

        function addStoredProfileToTable(ssid, securityType, ProfileNumber) {

            //add to ui (ssid name)
            var tr = document.createElement('tr');
            tr.setAttribute("ProfileNumber", ProfileNumber);
            var td1 = document.createElement('td');

            td1.innerHTML = ssid;
            var td2 = document.createElement('td');
            td2.innerHTML = getSecurityTypeString(securityType);
            var tbody = document.getElementsByClassName("tbodyStoredProfiles")[0];
            tr.appendChild(td1);
            tr.appendChild(td2);
            var td3 = document.createElement('td');
            tr.appendChild(td3);
            if (ProfileNumber) {
                //add delete button
                //button.onclick => removeSelectedProfile(p.ProfileNumber)
                var a = document.createElement('a');
                a.innerHTML = "X";
                a.style.color = "red";
                a.onclick = function () {
                    removeSelectedProfile(this.parentNode.parentNode.getAttribute("ProfileNumber"))
                    this.parentNode.parentNode.remove();
                }
                td3.appendChild(a);
            }
            tbody.appendChild(tr);
        }

        function onload() {
            //-----------------prepare values-----------------
            parseNetworks();
            //fill the combobox for the auto ui
            var select = document.createElement('select');
            select.className = "colMarginLeft";
            var option = document.createElement('option');
            option.text = SELECT_NETWORK;
            option.value = SELECT_NETWORK;
            select.appendChild(option);
            for (var i = 0; i < networks.length; i++) {
                var option = document.createElement('option');
                option.text = networks[i].SSID;
                option.value = networks[i].SSID;
                select.appendChild(option);
            }
            var option = document.createElement('option');
            option.text = MANUAL_NETWORK;
            option.value = MANUAL_NETWORK;
            option.style.fontWeight = "bold";

            select.appendChild(option);
            select.onchange = function () {
                var value = this.options[this.selectedIndex].value;
                if (value == MANUAL_NETWORK) {
                    document.getElementsByClassName("securityContainer")[0].style.display = "block";
                    document.getElementsByClassName("network")[0].querySelector(".networkName").readOnly = false;
                    document.getElementsByClassName("network")[0].querySelector(".networkName").disabled = false;
                    document.getElementsByClassName("network")[0].querySelector(".networkName").value = "";

                } else {
                    document.getElementsByClassName("securityContainer")[0].style.display = "none";
                    document.getElementsByClassName("network")[0].querySelector(".networkName").readOnly = true;
                    document.getElementsByClassName("network")[0].querySelector(".networkName").disabled = true;
                    document.getElementsByClassName("network")[0].querySelector(".networkName").value = value;

                }
                document.getElementsByClassName("network")[0].querySelector(".networkPassword").value = "";

            }
            var parent = document.getElementsByClassName("network")[0];
            parent.insertBefore(select, parent.firstChild)
            //----------prepare UI----------
            //build stored profiles
            for (var i = 0; i < storedProfiles.length; i++) {
                var p = storedProfiles[i];

                if (p.SSID) {
                    addStoredProfileToTable(p.SSID, p.SecurityType, p.ProfileNumber);
                }
            }
        }
        onload();

    </script>
</body>
</html>
