<div class="half-knob-box" >
    <input data-angleoffset="-125" data-anglearc="250"
           data-min="0" data-max="800" type="text" ng-if="currentValue"
           class="dial" knob-directive="{{currentValue}}">
    <span ng-repeat="x in rangeValues">{{x}}</span>
    <p class="title">{{title}}</p>
</div>
