<div class="table-responsive table-responsive-my" id="boxscroll2">
    <table class="table table-striped table-hover weekly" ng-if="scheduleview">
        <thead>
            <tr>
                <th>{{'MF_G_ZONE_NAME'|translate}} <a ng-click="addTimeCol()"><i class="fa fa-plus-square"></i></a></th>
                <th ng-if="scheduleview.scheduleType == 'Weekly'" ng-repeat="tb in scheduleview.startTimes track by $index" class="center">
                    <input ng-if="type" class="txtInsideEditableTable center bigTextFiled marginLeft15 timePicker2" type="text" ng-click="saveLastClickedItem(tb,$index)" ng-model="tb.timeStr" time-picker2 param="{{type}}" readonly /><a ng-if="scheduleview.startTimes.length>1" ng-click="delTimeCol($index)" class="btn  btn-bricky delByDay "><i class="fa fa-trash-o"></i></a> <!--ng-change="isAllowedTimeChanged(tb,$index)"-->
                </th>
                <th ng-if="scheduleview.scheduleType != 'Weekly'" ng-repeat="tb in scheduleview.startTimes track by $index" class="center">
                    <input ng-if="type" class="txtInsideEditableTable bigTextFiled marginLeft15 timePicker2" type="text" ng-change="stringToUnix($index,tb.timeStr)" ng-model="tb.timeStr" time-picker2 param="{{type}}" readonly /><a ng-click="delTimeCol($index)" class="btn  btn-bricky delByDay "><i class="fa fa-trash-o"></i></a>
                </th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="tb3 in scheduleview.zones track by $index">
                <td>

                    <a data-toggle="tooltip" title="{{tb3.zoneNumber}} / {{tb3.name}}" class="text-center Dots_3 inline maxWidth120px" ng-click="goToZone(tb3.zoneNumber)">{{tb3.zoneNumber}} / {{tb3.name}}</a>

                </td>
                <td ng-repeat="tb4 in tb3.starts track by $index" class="center">
                    <input class="txtInsideEditableTable smallTextFiled center" type="text" ng-model="tb4.durationStr" ng-change="bodyValChange(tb4)" select-on-click />
                </td>
            </tr>
        </tbody>
    </table>

</div>
<div id="timeNotAllowed" class="modal">
    <div class="modal-dialog colMarginLeft">
        <div class="modal-content">
            <div class="modal-header"><span> {{'G_WARRNING'|translate}}:<br /><b>{{'MF_DEVICE_VIEW_IRRIGATION_NOT_ALLOWED'|translate}}!</b> </span></div>
            <div class="modal-body">
                {{'MF_DEVICE_VIEW_IRRIGATION_NOT_ALLOWED_MESSAGE'|translate}}.

            </div>
            <div class="modal-footer">
                <button type="button" data-dismiss="modal" class="btn btn-default" ng-click="discardChanges()">
                    {{'G_DISCARD_CHANGES'|translate}}
                </button>
                <button type="button" class="btn btn-dark-grey" ng-click="allowAnyWay()">
                    {{'G_ALLOW_ANYWAY'|translate}}
                </button>
            </div>
        </div>
    </div>
</div>
