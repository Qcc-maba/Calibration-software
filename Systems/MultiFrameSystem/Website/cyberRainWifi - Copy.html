    function postAction(opCode) {
        if (!opCode) {

            var el = document.querySelector("#customPostOpcode");
            opCode = el.value;
        }
        var el_val = document.querySelector("#customPostValue");
        var val = el_val.value || "0";

        var closeAPProfile = new XMLHttpRequest();
        closeAPProfile.open("POST", "No_content", true);
        closeAPProfile.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
        var params = "__SL_P_" + opCode + "=" + val;
        closeAPProfile.setRequestHeader("Content-length", params.length);
        closeAPProfile.setRequestHeader("Connection", "close");
        closeAPProfile.send(params);
    }
    var serverPrefix = "http://cyber-rain.net/";
    function savePofiles() {

        var sentOnce = false;
        clearHttpError();

        var frameTableArray = document.getElementsByClassName("frameTable");
        for (var i = 0; i < frameTableArray.length ; i++) {
            if (i == 0) {
                //Manual table


            }


            var prio = frameTableArray[i].getElementsByClassName("prio")[0].getAttribute("priority");
            var select = frameTableArray[i].getElementsByTagName("select")[0];
            var selectedNetworkText = select.options[select.selectedIndex].text;
            if (selectedNetworkText == "-- select Network --") {
                continue;
            }
            var selectedNetwork = getNetwork(selectedNetworkText);
            var password = frameTableArray[i].getElementsByTagName('input')[0].value;
            var params = "__SL_P_P.A=" + selectedNetwork.SSID  								//SSID
                               + "&__SL_P_P.B=" + selectedNetwork.Type				//Type
                             + "&__SL_P_P.C=" + password							//Password
                               + "&__SL_P_P.D=" + prio;										//priority

            var addProfile = new XMLHttpRequest();
            addProfile.open("POST", serverPrefix + "profiles_add.html", true);
            addProfile.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
            addProfile.setRequestHeader("Content-length", params.length);
            addProfile.setRequestHeader("Connection", "close");
            addProfile.send(params);

        if (frameTableArray[0].style.display != 'none') {
            var prio = frameTableArray[0].getElementsByClassName("prio")[0].getAttribute("priority");
            var type;
            var form = frameTableArray[0].getElementsByTagName("form")[0];
            for (var i = 0; i < form.length; i++) {
                if (form[i].checked) {
                    type = form[i].value;
                }
            }
            var SSID = frameTableArray[0].getElementsByClassName("networkInputManual")[0].value;
            var password = frameTableArray[0].getElementsByClassName("passwordInputManual")[0].value;
            var params = "__SL_P_P.A=" + SSID  								//SSID
                               + "&__SL_P_P.B=" + type				//Type
                             + "&__SL_P_P.C=" + password							//Password
                               + "&__SL_P_P.D=" + prio;										//priority

            var addProfile = new XMLHttpRequest();
            addProfile.open("POST", serverPrefix + "profiles_add.html", true);
            addProfile.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
            addProfile.setRequestHeader("Content-length", params.length);
            addProfile.setRequestHeader("Connection", "close");
            removeAll_Request.onerror = function () {
                showHttpError();
            };

            addProfile.send(params);
        }



        var removeAll_Request = new XMLHttpRequest();
        removeAll_Request.open("POST", serverPrefix + "remove_all_profiles", true);
        removeAll_Request.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
        var removeAll_params = "__SL_P_ULD=0";
        removeAll_Request.setRequestHeader("Content-length", removeAll_params.length);
        removeAll_Request.setRequestHeader("Connection", "close");
        removeAll_Request.onerror
        removeAll_Request.onreadystatechange = function () {

            if (!sentOnce && removeAll_Request.status >= 200 && removeAll_Request.status < 300) {
                sentOnce = true;


            }
        }
        removeAll_Request.send(removeAll_params);
    }

    function parseNetworks() {

        for (var i = 1; i <= 10; i++) {
            var network = networksValues["W" + i];
            if (!network.startsWith("SSID"))
                continue;

            var parts = network.split(',');
            var o = {};
            for (p in parts) {
                var tuple = parts[p].split(':');
                switch (tuple[0].trim()) {
                    case "SSID":
                        o.SSID = tuple[1];
                        break;
                    case "Type":
                        o.Type = Number(tuple[1]);
                        break;
                    case "RSSI":
                        o.RSSI = tuple[1];
                        break;
                }
            }
            networks.push(o);
        }
    }

    function getNetwork(SSID) {

        for (var net in networks) {

            if (networks[net].SSID == SSID) {
                return networks[net];
            }
        }
        return null;
    }

        else {
